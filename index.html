<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="KingsHall — one place to begin your digital world." />
    <title>KingsHall — Your world starts here</title>
    <style>
      #kh-refresh-splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#000;opacity:1;visibility:visible;transition:opacity .35s ease,visibility .35s ease}
      #kh-refresh-splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
      .kh-splash-content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transform:translateY(-3vh);width:100%;height:100%}
      .kh-splash-crown{display:block;width:min(62vw,330px);height:auto;overflow:visible;filter:drop-shadow(0 10px 22px rgba(190,205,220,.12))}
      .kh-splash-wordmark{font:600 13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.42em;text-transform:uppercase;color:#dce2e9;padding-left:.42em}
      @media(min-width:700px){.kh-splash-crown{width:min(28vw,330px)}.kh-splash-wordmark{font-size:15px}}
      @media(prefers-reduced-motion:reduce){#kh-refresh-splash{transition:none}}
    </style>
  </head>
  <body>
    <div id="kh-refresh-splash" aria-label="KingsHall loading" role="status">
      <div class="kh-splash-content">
        <svg class="kh-splash-crown" viewBox="0 0 128 112" role="img" aria-label="Silver KingsHall crown">
          <defs>
            <linearGradient id="splash-metal-face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".16" stop-color="#7c8793"/><stop offset=".3" stop-color="#f8fbff"/><stop offset=".47" stop-color="#555f6c"/><stop offset=".63" stop-color="#eef3f8"/><stop offset=".8" stop-color="#858f9b"/><stop offset="1" stop-color="#fdfefe"/></linearGradient>
            <linearGradient id="splash-metal-side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9eef4"/><stop offset=".48" stop-color="#4b535f"/><stop offset="1" stop-color="#aab4bf"/></linearGradient>
            <linearGradient id="splash-metal-band" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fdfefe"/><stop offset=".22" stop-color="#87919c"/><stop offset=".5" stop-color="#303741"/><stop offset=".78" stop-color="#dfe5eb"/><stop offset="1" stop-color="#707a86"/></linearGradient>
          </defs>
          <ellipse cx="64" cy="99" rx="43" ry="5" fill="#aebdce" opacity=".2"/>
          <path d="M17 37 38 52 63 12 89 52 111 37 101 84 27 84Z" fill="#171c24" stroke="#f4f7fa" stroke-width="1.8" stroke-linejoin="round" transform="translate(0 3)"/>
          <path d="M15 31 37 47 63 8 90 47 113 31 101 81 27 81Z" fill="url(#splash-metal-face)" stroke="#f9fbff" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M15 31 37 47 34 62 24 49Z" fill="#f8fbff" opacity=".78"/>
          <path d="M37 47 63 8 58 53 46 64Z" fill="#fff" opacity=".78"/>
          <path d="M63 8 90 47 76 64 64 52Z" fill="#5b6571" opacity=".82"/>
          <path d="M90 47 113 31 103 50 95 63Z" fill="#fff" opacity=".72"/>
          <path d="M27 81 101 81 97 94 31 94Z" fill="url(#splash-metal-side)" stroke="#e8edf3" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M31 94 97 94 93 101 35 101Z" fill="url(#splash-metal-band)" stroke="#b9c2cc" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M19 32 37 47 63 8 90 47 109 32" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
          <path d="M29 84 99 84" stroke="#fff" stroke-width="1.7" opacity=".92"/>
          <path d="M39 52 34 76M63 16 63 76M87 52 94 76" stroke="#fff" stroke-width="1.1" opacity=".55"/>
          <circle cx="15" cy="30" r="3.1" fill="#fff"/><circle cx="63" cy="7.5" r="3.4" fill="#fff"/><circle cx="113" cy="30" r="3.1" fill="#fff"/>
        </svg>
        <span class="kh-splash-wordmark">KingsHall</span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const splash = document.getElementById('kh-refresh-splash');
        let dismissed = false;
        const dismiss = () => { if (dismissed || !splash) return; dismissed = true; splash.classList.add('is-hidden'); window.setTimeout(() => splash.remove(), 400); };
        window.addEventListener('load', () => window.setTimeout(dismiss, 1500), { once: true });
        window.setTimeout(dismiss, 3500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
