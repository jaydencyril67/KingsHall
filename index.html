<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="background-color" content="#0A0A0A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="KingsHall — one place to begin your digital world." />
    <link rel="manifest" href="/manifest.webmanifest?v=7" />
    <link rel="preload" href="/fonts/STIXTwoText-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/STIXTwoText-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="/kingshall-foreground.svg?v=1" fetchpriority="high" />
    <link rel="icon" type="image/svg+xml" href="/kingshall-pwa-icon.svg?v=4" />
    <link rel="apple-touch-icon" href="/kingshall-mark.svg?v=6" />
    <title>KingsHall — Your world starts here</title>
    <style>
      /* Match CryBots: locally bundled STIX faces for browser, PWA and Android WebView. */
      @font-face{font-family:"STIX Two Text";src:url("/fonts/STIXTwoText-Regular.woff2") format("woff2");font-weight:100 699;font-style:normal;font-display:block}
      @font-face{font-family:"STIX Two Text";src:url("/fonts/STIXTwoText-Bold.woff2") format("woff2");font-weight:700 1000;font-style:normal;font-display:block}
      :root{--kingshall-global-font:"STIX Two Text";font-family:var(--kingshall-global-font)!important;font-synthesis:none!important}
      html,body,#root,*,*::before,*::after,button,input,textarea,select,option{font-family:var(--kingshall-global-font)!important;font-synthesis:none!important}
      *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;scrollbar-width:none;-ms-overflow-style:none}
      html,body,#root,*{scrollbar-width:none!important;scrollbar-color:transparent transparent!important;-ms-overflow-style:none!important}
      html::-webkit-scrollbar,body::-webkit-scrollbar,#root::-webkit-scrollbar,*::-webkit-scrollbar,html::-webkit-scrollbar-thumb,body::-webkit-scrollbar-thumb,#root::-webkit-scrollbar-thumb,*::-webkit-scrollbar-thumb,html::-webkit-scrollbar-track,body::-webkit-scrollbar-track,#root::-webkit-scrollbar-track,*::-webkit-scrollbar-track,html::-webkit-scrollbar-corner,body::-webkit-scrollbar-corner,#root::-webkit-scrollbar-corner,*::-webkit-scrollbar-corner{display:none!important;width:0!important;height:0!important;min-width:0!important;min-height:0!important;border:0!important;background:transparent!important;color:transparent!important}
      input,textarea,select,[contenteditable="true"],[contenteditable=""]{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text}
      #kh-refresh-splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);width:100vw;height:100dvh;min-height:100vh;overflow:hidden;background:#0A0A0A;color:#f4f4f4}
      .kh-splash-content{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
      .kh-splash-logo-circle{display:grid;place-items:center;width:92px;height:92px;flex:0 0 92px;box-sizing:border-box;border:1px solid rgba(255,255,255,.10);border-radius:50%;background:#000;box-shadow:none}
      .kh-splash-crown{display:block;width:72px;height:72px;max-width:100%;max-height:100%;object-fit:contain;object-position:center center;margin:0;justify-self:center;align-self:center;border-radius:0;background:transparent}
      .kh-splash-wordmark{margin:0;color:inherit;font-family:"STIX Two Text",serif;font-size:13px;font-weight:600;line-height:1.4;letter-spacing:.14em;text-transform:uppercase}
      .kh-splash-shimmer{position:relative;contain:paint;width:180px;height:3px;margin-top:-8px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.18);isolation:isolate}.kh-splash-shimmer::after{content:"";position:absolute;inset:0 auto 0 0;width:42%;border-radius:inherit;background:linear-gradient(90deg,transparent,#fff,transparent);transform:translate3d(-130%,0,0);backface-visibility:hidden;will-change:transform;animation:kh-splash-shimmer 1.15s linear infinite!important;animation-play-state:running!important}@keyframes kh-splash-shimmer{0%{transform:translate3d(-100%,0,0)}100%{transform:translate3d(240%,0,0)}}
      .kh-splash-powered{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 28px);z-index:10001;display:block;margin:0;padding:0 16px;box-sizing:border-box;color:inherit;font-family:"STIX Two Text",serif;font-size:12px;font-weight:700;line-height:1.4;letter-spacing:.08em;opacity:.72;text-align:center;pointer-events:none}
    </style>
  </head>
  <body>
    <div id="kh-refresh-splash" aria-label="KingsHall loading" role="status">
      <div class="kh-splash-content">
        <div class="kh-splash-logo-circle"><img class="kh-splash-crown" src="/kingshall-foreground.svg?v=1" alt="KingsHall silver crown" fetchpriority="high" decoding="sync" /></div>
        <p class="kh-splash-wordmark">KingsHall</p>
        <div class="kh-splash-shimmer" aria-hidden="true"></div>
      </div>
      <p class="kh-splash-powered">Powered by KingsHall</p>
    </div>
    <div id="root"></div>
    <script>
      document.addEventListener("contextmenu", function(event) {
        const target = event.target;
        if (!(target instanceof Element)) return;
        if (target.closest('input, textarea, select, [contenteditable="true"], [contenteditable=""]')) return;
        event.preventDefault();
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
