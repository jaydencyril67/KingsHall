<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="KingsHall — one place to begin your digital world." />
    <link rel="preload" as="image" href="/kingshall-mark.svg?v=5" fetchpriority="high" />
    <link rel="icon" type="image/svg+xml" href="/kingshall-mark.svg?v=4" />
    <link rel="apple-touch-icon" href="/kingshall-mark.svg?v=4" />
    <title>KingsHall — Your world starts here</title>
    <style>
      *{-webkit-tap-highlight-color:transparent;scrollbar-width:none;-ms-overflow-style:none}html,body,#root,*{scrollbar-width:none!important;scrollbar-color:transparent transparent!important;-ms-overflow-style:none!important}html::-webkit-scrollbar,body::-webkit-scrollbar,#root::-webkit-scrollbar,*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}input,textarea,select,[contenteditable="true"],[contenteditable=""]{-webkit-user-select:text;user-select:text}
      #kh-refresh-splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);width:100vw;height:100dvh;min-height:100vh;overflow:hidden;background:#000;color:#f4f4f4}
      .kh-splash-content{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
      .kh-splash-logo-circle{display:grid;place-items:center;width:92px;height:92px;flex:0 0 92px;box-sizing:border-box;border:1px solid rgba(255,255,255,.10);border-radius:50%;background:radial-gradient(circle at 34% 26%,#1c1c1c 0%,#0b0b0b 62%,#030303 100%);box-shadow:inset 0 1px 2px rgba(255,255,255,.06)}
      .kh-splash-crown{display:block;width:72px;height:72px;max-width:100%;max-height:100%;object-fit:contain;object-position:center center;margin:0;justify-self:center;align-self:center;border-radius:50%;background:#000}
      .kh-splash-wordmark{margin:0;color:inherit;font-family:"STIX Two Text",serif;font-size:13px;font-weight:600;line-height:1.4;letter-spacing:.14em;text-transform:uppercase}
      .kh-splash-shimmer{position:relative;contain:paint;width:180px;height:3px;margin-top:-8px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.18);isolation:isolate}.kh-splash-shimmer::after{content:"";position:absolute;inset:0 auto 0 0;width:42%;border-radius:inherit;background:linear-gradient(90deg,transparent,#fff,transparent);transform:translate3d(-130%,0,0);backface-visibility:hidden;will-change:transform;animation:kh-splash-shimmer 1.15s linear infinite!important;animation-play-state:running!important}@keyframes kh-splash-shimmer{0%{transform:translate3d(-130%,0,0)}100%{transform:translate3d(340%,0,0)}}
      .kh-splash-powered{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 28px);z-index:10001;display:block;margin:0;padding:0 16px;box-sizing:border-box;color:inherit;font-family:"STIX Two Text",serif;font-size:12px;font-weight:700;line-height:1.4;letter-spacing:.08em;opacity:.72;text-align:center;pointer-events:none}
    </style>
  </head>
  <body>
    <div id="kh-refresh-splash" aria-label="KingsHall loading" role="status">
      <div class="kh-splash-content">
        <div class="kh-splash-logo-circle"><img class="kh-splash-crown" src="/kingshall-mark.svg?v=5" alt="KingsHall silver crown" fetchpriority="high" decoding="sync" /></div>
        <p class="kh-splash-wordmark">KingsHall</p>
        <div class="kh-splash-shimmer" aria-hidden="true"></div>
      </div>
      <p class="kh-splash-powered">Powered by KingsHall</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
