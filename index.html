<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="KingsHall — one place to begin your digital world." />
    <link rel="icon" type="image/svg+xml" href="/kingshall-mark.svg?v=4" />
    <link rel="apple-touch-icon" href="/kingshall-mark.svg?v=4" />
    <title>KingsHall — Your world starts here</title>
    <style>
      #kh-refresh-splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);width:100vw;height:100dvh;min-height:100vh;overflow:hidden;background:#000;color:#f4f4f4;opacity:1;visibility:visible;transition:opacity .35s ease,visibility .35s ease}
      #kh-refresh-splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
      .kh-splash-content{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
      .kh-splash-logo-circle{display:grid;place-items:center;width:92px;height:92px;flex:0 0 92px;box-sizing:border-box;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:radial-gradient(circle at 34% 26%,#1c1c1c 0%,#0b0b0b 62%,#030303 100%);box-shadow:0 0 0 5px rgba(255,255,255,.025),inset 0 1px 2px rgba(255,255,255,.08)}
      .kh-splash-crown{display:block;width:72px;height:72px;object-fit:contain}
      .kh-splash-wordmark{margin:0;color:inherit;font-family:"STIX Two Text",serif;font-size:13px;font-weight:600;line-height:1.4;letter-spacing:.14em;text-transform:uppercase}
      .kh-splash-shimmer{width:180px;height:3px;margin-top:-8px;border-radius:999px;background:currentColor;animation:kh-splash-shimmer 1.4s ease-in-out infinite;transform-origin:center}
      .kh-splash-powered{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 28px);z-index:10001;display:block;margin:0;padding:0 16px;box-sizing:border-box;color:inherit;font-family:"STIX Two Text",serif;font-size:12px;font-weight:700;line-height:1.4;letter-spacing:.08em;opacity:.72;text-align:center;pointer-events:none}
      @keyframes kh-splash-shimmer{0%,100%{transform:scaleX(.72);opacity:.45}50%{transform:scaleX(1);opacity:1}}
    </style>
  </head>
  <body>
    <div id="kh-refresh-splash" aria-label="KingsHall loading" role="status">
      <div class="kh-splash-content">
        <div class="kh-splash-logo-circle"><img class="kh-splash-crown" src="/kingshall-splash-crown.svg?v=1" alt="KingsHall metallic crown" fetchpriority="high" decoding="async" /></div>
        <p class="kh-splash-wordmark">KingsHall</p>
        <div class="kh-splash-shimmer" aria-hidden="true"></div>
      </div>
      <p class="kh-splash-powered">Your world starts here</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
