<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="KingsHall — one place to begin your digital world." />
    <link rel="icon" type="image/svg+xml" href="/kingshall-mark.svg?v=2" />
    <link rel="apple-touch-icon" href="/kingshall-mark.svg?v=2" />
    <title>KingsHall — Your world starts here</title>
    <style>
      #kh-refresh-splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#000;opacity:1;visibility:visible;transition:opacity .35s ease,visibility .35s ease}
      #kh-refresh-splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
      .kh-splash-content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transform:translateY(-3vh);width:100%;height:100%}
      .kh-splash-crown{display:block;width:min(30vw,180px);height:auto;aspect-ratio:1;object-fit:contain;overflow:visible}
      .kh-splash-wordmark{font:600 13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.42em;text-transform:uppercase;color:#dce2e9;padding-left:.42em}
      @media(min-width:700px){.kh-splash-crown{width:min(18vw,180px)}.kh-splash-wordmark{font-size:15px}}
      @media(prefers-reduced-motion:reduce){#kh-refresh-splash{transition:none}}
    </style>
  </head>
  <body>
    <div id="kh-refresh-splash" aria-label="KingsHall loading" role="status">
      <div class="kh-splash-content">
        <img class="kh-splash-crown" src="/kingshall-mark.svg?v=2" alt="KingsHall emblem" />
        <span class="kh-splash-wordmark">KingsHall</span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const splash = document.getElementById('kh-refresh-splash');
        let dismissed = false;
        const dismiss = () => { if (dismissed || !splash) return; dismissed = true; splash.classList.add('is-hidden'); window.setTimeout(() => splash.remove(), 400); };
        window.addEventListener('load', () => window.setTimeout(dismiss, 1500), { once: true });
        window.setTimeout(dismiss, 3500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
