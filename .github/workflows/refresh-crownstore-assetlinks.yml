name: Refresh CrownStore Android passkey association

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-crownstore-assetlinks.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KingsHall website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add the CrownStore signing certificate to Digital Asset Links
        env:
          CROWNSTORE_CERT_SHA256: ${{ vars.CROWNSTORE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          fingerprint = os.environ.get("CROWNSTORE_CERT_SHA256", "").strip().upper()
          if not re.fullmatch(r"(?:[0-9A-F]{2}:){31}[0-9A-F]{2}", fingerprint):
              # Derive the public signing-certificate fingerprint from the latest
              # stable APK when the repository variable has not been configured.
              request = urllib.request.Request(
                  "https://api.github.com/repos/jaydencyril67/CrownStore/releases/latest",
                  headers={"Accept": "application/vnd.github+json", "User-Agent": "KingsHall-assetlinks-refresh"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
              asset = next((item for item in release.get("assets", []) if item.get("name") == "CrownStore.apk"), None)
              if not asset or not asset.get("browser_download_url"):
                  raise SystemExit("The latest stable CrownStore release has no downloadable APK.")
              apk_path = Path("CrownStore.apk")
              apk_request = urllib.request.Request(asset["browser_download_url"], headers={"User-Agent": "KingsHall-assetlinks-refresh"})
              with urllib.request.urlopen(apk_request, timeout=90) as response, apk_path.open("wb") as output:
                  output.write(response.read())
              sdk_root = Path(os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk"))
              signers = sorted((sdk_root / "build-tools").glob("*/apksigner"))
              if not signers:
                  sdkmanager = sdk_root / "cmdline-tools" / "latest" / "bin" / "sdkmanager"
                  if not sdkmanager.is_file():
                      raise SystemExit("Android sdkmanager is unavailable; cannot derive CrownStore's signing certificate.")
                  subprocess.run([str(sdkmanager), "build-tools;35.0.0"], check=True, timeout=240)
                  signers = sorted((sdk_root / "build-tools").glob("*/apksigner"))
              if not signers:
                  raise SystemExit("Android apksigner was not installed; cannot derive CrownStore's signing certificate.")
              signer = signers[-1]
              result = subprocess.run([str(signer), "verify", "--print-certs", str(apk_path)], check=True, capture_output=True, text=True)
              signer_output = result.stdout + "\n" + result.stderr
              match = re.search(r"(?:Signer #1|V[234] Signer): certificate SHA-256 digest:\s*([0-9A-Fa-f]{64})", signer_output, re.IGNORECASE)
              if not match:
                  raise SystemExit("apksigner did not report a SHA-256 signing-certificate fingerprint. Output start: " + signer_output[:2500] + " Output end: " + signer_output[-1500:])
              hex_digest = match.group(1).upper()
              fingerprint = ":".join(hex_digest[index:index + 2] for index in range(0, len(hex_digest), 2))
              public_key_match = re.search(r"(?:Signer #1|V[234] Signer): public key SHA-256 digest:\s*([0-9A-Fa-f]{64})", signer_output, re.IGNORECASE)
              if not public_key_match:
                  raise SystemExit("apksigner did not report the public-key SHA-256 digest needed for Android passkeys. Output was: " + signer_output[-2000:])
              public_key_digest = bytes.fromhex(public_key_match.group(1))
              android_origin = "android:apk-key-hash:" + __import__("base64").urlsafe_b64encode(public_key_digest).decode("ascii").rstrip("=")
              print("Derived CrownStore signing-certificate fingerprint from the latest stable APK.")
              print("Set WEBAUTHN_ANDROID_ORIGIN to include this exact origin on ApiKingsHall Render: " + android_origin)
          if not re.fullmatch(r"(?:[0-9A-F]{2}:){31}[0-9A-F]{2}", fingerprint):
              raise SystemExit("CROWNSTORE_CERT_SHA256 must be a colon-separated SHA-256 certificate fingerprint.")

          path = Path("public/.well-known/assetlinks.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data = [
              item for item in data
              if not (
                  item.get("target", {}).get("namespace") == "android_app"
                  and item.get("target", {}).get("package_name") == "online.kingshall.crownstore"
              )
          ]
          data.append({
              "relation": ["delegate_permission/common.get_login_creds"],
              "target": {
                  "namespace": "android_app",
                  "package_name": "online.kingshall.crownstore",
                  "sha256_cert_fingerprints": [fingerprint]
              }
          })
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("CrownStore Android passkey association prepared.")
          PY

      - name: Commit Digital Asset Links update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.well-known/assetlinks.json
          if git diff --cached --quiet; then
            echo "CrownStore asset link is already current."
          else
            git commit -m "Add CrownStore Android passkey association"
            git push origin HEAD:main
          fi
