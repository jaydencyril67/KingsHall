name: KingsHall Signed Production APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingshall-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing repository secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing repository secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing repository secret: ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing repository secret: ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Install frontend dependencies
        run: npm install

      - name: Build React frontend
        run: npm run build

      - name: Add Android wrapper
        run: npx cap add android

      - name: Sync built web app into Android
        run: npx cap sync android

      - name: Generate KingsHall Android launcher icons
        run: |
          npm install --no-save --package-lock=false sharp
          node scripts/install-kingshall-branding.mjs

      - name: Install native KingsHall device-account provider
        run: python3 scripts/install-android-account-provider.py

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kingshall-release.keystore
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kingshall-release.keystore"
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle")
          source = gradle_file.read_text()
          if "signingConfigs {" in source:
              raise SystemExit("Unexpected existing signing configuration; refusing to patch it twice.")
          marker = "    buildTypes {"
          if marker not in source:
              raise SystemExit("Could not find Android buildTypes block in generated app/build.gradle.")
          signing = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
          source = source.replace(marker, signing + marker, 1)
          build_types_index = source.index(marker)
          release_index = source.find("release {", build_types_index)
          if release_index < 0:
              raise SystemExit("Could not find release build type in generated app/build.gradle.")
          insert_at = source.find("\n", release_index) + 1
          source = source[:insert_at] + "            signingConfig signingConfigs.release\n" + source[insert_at:]
          gradle_file.write_text(source)
          PY

      - name: Build signed production APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kingshall-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload signed production APK
        uses: actions/upload-artifact@v4
        with:
          name: KingsHall-production-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
