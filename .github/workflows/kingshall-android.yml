name: Build KingsHall Production Android APK

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build and publish the signed KingsHall production APK'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: kingshall-release-apk
  cancel-in-progress: true

jobs:
  build-signed-release-apk:
    if: inputs.build_apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Calculate next KingsHall release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName,isDraft,isPrerelease > releases.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          releases = json.loads(Path("releases.json").read_text())
          versions = []
          for release in releases:
              if release.get("isDraft") or release.get("isPrerelease"):
                  continue
              tag = release.get("tagName", "")
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag)
              if match:
                  versions.append(tuple(map(int, match.groups())))

          if not versions:
              next_version = (1, 0, 0)
          else:
              major, minor, patch = max(versions)
              if patch < 9:
                  patch += 1
              else:
                  patch = 0
                  if minor < 9:
                      minor += 1
                  else:
                      minor = 0
                      major += 1
              next_version = (major, minor, patch)

          version = ".".join(map(str, next_version))
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"app_version={version}\n")
          print(f"Next KingsHall release version: {version}")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-kingshall-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-kingshall-

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Verify signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing repository secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing repository secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing repository secret: ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing repository secret: ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Install frontend and pinned Android branding dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false \
            @capacitor/assets@3.0.5 \
            @capacitor/push-notifications@6.0.2 \
            sharp

      - name: Verify KingsHall web build
        run: npm run build

      - name: Add Android wrapper
        run: npx cap add android

      - name: Set Android compile SDK to 35 for AndroidX dependencies
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/variables.gradle")
          if not path.is_file():
              raise SystemExit("Capacitor did not generate android/variables.gradle; cannot safely set compile SDK.")

          text = path.read_text()
          updated, count = re.subn(
              r"(?m)^(\s*compileSdkVersion\s*=\s*)\d+\s*$",
              r"\g<1>35",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find compileSdkVersion in android/variables.gradle; no build settings changed.")
          path.write_text(updated)
          print("Set Android compileSdkVersion to 35. targetSdkVersion and minSdkVersion are unchanged.")
          PY

      - name: Generate KingsHall Android app icons from the master logo
        run: |
          set -euo pipefail
          mkdir -p assets
          cp public/kingshall-mark.svg assets/icon.svg
          cp public/kingshall-mark.svg assets/splash.svg
          npx capacitor-assets generate --android

      - name: Sync built web app into Android
        run: npx cap sync android

      - name: Configure Firebase for KingsHall Android push
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("FIREBASE_GOOGLE_SERVICES_JSON", "").strip()
          encoded = os.environ.get("FIREBASE_GOOGLE_SERVICES_JSON_BASE64", "").strip()
          if raw:
              content = raw
              source = "raw JSON secret"
          elif encoded:
              try:
                  decoded = base64.b64decode(encoded, validate=True).decode("utf-8")
                  json.loads(decoded)
                  content = decoded
                  source = "Base64 secret"
              except Exception:
                  # Recover older setups that accidentally stored raw JSON in this secret.
                  content = encoded
                  source = "legacy secret (raw JSON detected)"
          else:
              raise SystemExit(
                  "Missing Firebase Android configuration. Add FIREBASE_GOOGLE_SERVICES_JSON "
                  "or FIREBASE_GOOGLE_SERVICES_JSON_BASE64 to KingsHall repository Actions secrets."
              )

          try:
              config = json.loads(content)
          except Exception as exc:
              raise SystemExit(f"Firebase Android configuration is not valid JSON: {exc}") from exc

          packages = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          ]
          if "online.kingshall.foundation" not in packages:
              raise SystemExit(
                  "Firebase config must contain the KingsHall Android package online.kingshall.foundation."
              )
          Path("android/app/google-services.json").write_text(
              json.dumps(config, indent=2) + "\n",
              encoding="utf-8",
          )

          root = Path("android/build.gradle")
          root_text = root.read_text()
          if "com.google.gms:google-services" not in root_text:
              marker = "dependencies {"
              start = root_text.find(marker)
              end = root_text.find("}", start) if start >= 0 else -1
              if end < 0:
                  raise SystemExit("Could not find the Android root Gradle dependencies block.")
              root_text = root_text[:end] + "\n        classpath 'com.google.gms:google-services:4.4.2'" + root_text[end:]
              root.write_text(root_text)

          app = Path("android/app/build.gradle")
          app_text = app.read_text()
          plugin = "apply plugin: 'com.google.gms.google-services'"
          if plugin not in app_text:
              app_text += "\n" + plugin + "\n"
          marker = "dependencies {"
          start = app_text.find(marker)
          end = app_text.find("}", start) if start >= 0 else -1
          if end < 0:
              raise SystemExit("Could not find the Android app dependencies block.")
          additions = []
          if "implementation platform('com.google.firebase:firebase-bom:33.7.0')" not in app_text:
              additions.append("    implementation platform('com.google.firebase:firebase-bom:33.7.0')")
          if "implementation 'com.google.firebase:firebase-messaging'" not in app_text:
              additions.append("    implementation 'com.google.firebase:firebase-messaging'")
          if additions:
              app_text = app_text[:end] + "\n" + "\n".join(additions) + "\n" + app_text[end:]
          app.write_text(app_text)
          print(f"Configured Firebase Cloud Messaging for online.kingshall.foundation ({source}).")
          PY

      - name: Match KingsHall APK launcher icons to the PWA master icon
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const root = 'android/app/src/main/res';
          const source = 'public/kingshall-pwa-icon.svg';
          const densities = {
            mdpi: 48,
            hdpi: 72,
            xhdpi: 96,
            xxhdpi: 144,
            xxxhdpi: 192
          };

          (async () => {
            for (const [density, size] of Object.entries(densities)) {
              const dir = path.join(root, 'mipmap-' + density);
              fs.mkdirSync(dir, { recursive: true });

              // Keep the complete PWA master composition in the launcher bitmap.
              // Do not route it through an adaptive foreground: Android's adaptive
              // safe-zone and launcher mask shrink/reframe this artwork compared
              // with the installed PWA icon.
              for (const name of ['ic_launcher.png', 'ic_launcher_round.png']) {
                await sharp(source)
                  .resize(size, size, { fit: 'fill' })
                  .png()
                  .toFile(path.join(dir, name));
              }

              // These are not used once adaptive XMLs are removed; delete them
              // to avoid leaving a misleading alternate foreground icon behind.
              const foreground = path.join(dir, 'ic_launcher_foreground.png');
              if (fs.existsSync(foreground)) fs.rmSync(foreground);
            }

            // Force Android to use the exact master-derived launcher bitmaps
            // instead of adaptive resources that apply an extra inset/mask.
            const adaptiveDir = path.join(root, 'mipmap-anydpi-v26');
            for (const name of ['ic_launcher.xml', 'ic_launcher_round.xml']) {
              const file = path.join(adaptiveDir, name);
              if (fs.existsSync(file)) fs.rmSync(file);
            }

            console.log('KingsHall APK launcher bitmaps now use the full PWA master icon composition at every density; adaptive foreground resizing is disabled.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Configure unified KingsHall native launch splash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/drawable-nodpi android/app/src/main/res/values android/app/src/main/res/values-v31

          # Compose the transparent silver crown over its own circular dark backdrop.
          # The circle is pure black; the outer launch background is near-black (#0A0A0A).
          node - <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');

          (async () => {
            const markSvg = fs.readFileSync('public/kingshall-mark.svg', 'utf8');
            // Reuse the exact app-wide KingsHall mark, removing only its black canvas
            // so it sits cleanly inside the native splash's circular backdrop.
            const crown = Buffer.from(markSvg.replace('<rect id="background" data-name="Background" width="720" height="721" fill="rgb(0,0,0)"/>', ''));
            const circle = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="720" height="721"><circle cx="360" cy="360.5" r="360" fill="#000000" stroke="#000000" stroke-width="0"/></svg>');
            // One visible size on every Android version: 92dp circle + 72dp crown.
            // Android 12+ uses a 512px icon canvas displayed as 288dp, so calculate
            // the exact pixel equivalents (164px circle, 128px crown) from those same dp sizes.
            const holderDp = 92;
            const artworkDp = 72;
            const systemCanvasPx = 512;
            const systemCanvasDp = 288;
            const systemHolderPx = Math.round(holderDp / systemCanvasDp * systemCanvasPx);
            const systemArtworkPx = Math.round(artworkDp / systemCanvasDp * systemCanvasPx);
            if (systemHolderPx !== 164 || systemArtworkPx !== 128) {
              throw new Error('KingsHall Android 12+ splash scale no longer matches the 92dp / 72dp legacy size.');
            }
            const makeComposition = async (circleSize, crownSize, filename) => {
              const crownLayer = await sharp(crown).resize(crownSize, crownSize, { fit: 'contain' }).png().toBuffer();
              const circleLayer = await sharp(circle).resize(circleSize, circleSize, { fit: 'fill' }).png().toBuffer();
              const canvas = sharp({ create: { width: 512, height: 512, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } });
              await canvas.composite([
                { input: circleLayer, left: Math.round((512 - circleSize) / 2), top: Math.round((512 - circleSize) / 2) },
                { input: crownLayer, left: Math.round((512 - crownSize) / 2), top: Math.round((512 - crownSize) / 2) }
              ]).png().toFile(filename);
            };
            await makeComposition(512, 400, 'android/app/src/main/res/drawable-nodpi/kingshall_splash_logo.png');
            await makeComposition(164, 128, 'android/app/src/main/res/drawable-nodpi/kingshall_splash_logo_v31.png');

            const branding = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320"><rect width="800" height="320" fill="none"/><text x="400" y="174" text-anchor="middle" fill="#f4f4f4" font-family="STIX Two Text, serif" font-size="72" font-weight="700" letter-spacing="3">KingsHall</text></svg>');
            await sharp(branding).png().toFile('android/app/src/main/res/drawable-nodpi/kingshall_branding.png');
            console.log('Created KingsHall splash crown, circular backdrop, and branding.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

          cat > android/app/src/main/res/drawable/kingshall_launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/kingshall_splash_background" />
              <item
                  android:width="92dp"
                  android:height="92dp"
                  android:gravity="center"
                  android:drawable="@drawable/kingshall_splash_logo" />
              <item
                  android:width="160dp"
                  android:height="64dp"
                  android:gravity="center|bottom"
                  android:bottom="51dp"
                  android:drawable="@drawable/kingshall_branding" />
          </layer-list>
          XML

          cat > android/app/src/main/res/values/kingshall_splash_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="kingshall_splash_background">#0A0A0A</color>
          </resources>
          XML

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/res/values/styles.xml")
          text = path.read_text()
          pattern = re.compile(r'(?s)<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>')
          replacement = """<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
              <item name="android:windowBackground">@drawable/kingshall_launch_background</item>
              <item name="windowSplashScreenBackground">@color/kingshall_splash_background</item>
              <item name="windowSplashScreenAnimatedIcon">@drawable/kingshall_splash_logo</item>
              <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
          </style>"""
          if not pattern.search(text):
              raise SystemExit("Could not find Capacitor AppTheme.NoActionBarLaunch in values/styles.xml")
          path.write_text(pattern.sub(lambda _: replacement, text, count=1))
          PY

          cat > android/app/src/main/res/values-v31/kingshall_splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:windowSplashScreenBackground">@color/kingshall_splash_background</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/kingshall_splash_logo_v31</item>
                  <item name="android:windowSplashScreenBrandingImage">@drawable/kingshall_branding</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          XML

      - name: Set KingsHall Android version
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["APP_VERSION"].strip()
          version_code = os.environ["APP_VERSION_CODE"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("APP_VERSION must use semantic version format such as 1.0.0")

          path = Path("android/app/build.gradle")
          text = path.read_text()
          text, code_count = re.subn(
              r"(?m)^\s*versionCode\s+\d+\s*$",
              f"        versionCode {version_code}",
              text,
              count=1,
          )
          text, name_count = re.subn(
              r"""(?m)^\s*versionName\s+["'][^"']*["']\s*$""",
              f'versionName "{version}"',
              text,
              count=1,
          )
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode and versionName")
          path.write_text(text)
          print(f"Configured KingsHall {version} (versionCode {version_code})")
          PY

      - name: Install native KingsHall device-account provider
        run: python3 scripts/install-android-account-provider.py

      - name: Install native KingsHall passkey provider
        run: python3 scripts/install-android-native-webauthn.py

      - name: Install native Android photo gallery
        run: python3 scripts/install-android-native-gallery.py

      - name: Install native KingsHall APK updater
        run: python3 scripts/install-android-app-update.py

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kingshall-release.keystore
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kingshall-release.keystore"
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle")
          source = gradle_file.read_text()
          if "signingConfigs {" in source:
              raise SystemExit("Unexpected existing signing configuration; refusing to patch it twice.")
          marker = "    buildTypes {"
          if marker not in source:
              raise SystemExit("Could not find Android buildTypes block in generated app/build.gradle.")
          signing = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
          source = source.replace(marker, signing + marker, 1)
          build_types_index = source.index(marker)
          release_index = source.find("release {", build_types_index)
          if release_index < 0:
              raise SystemExit("Could not find release build type in generated app/build.gradle.")
          insert_at = source.find("\n", release_index) + 1
          source = source[:insert_at] + "            signingConfig signingConfigs.release\n" + source[insert_at:]
          gradle_file.write_text(source)
          PY

      - name: Generate KingsHall Digital Asset Links association
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kingshall-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Use the same permanent certificate that signs the published APK.
          CERT_SHA256="$(keytool -exportcert \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | openssl dgst -sha256 -binary | od -An -v -tx1 | tr -d ' \n' | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')"
          ANDROID_KEY_HASH="$(keytool -exportcert \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')"

          test -n "$CERT_SHA256"
          test -n "$ANDROID_KEY_HASH"
          mkdir -p public/.well-known
          python3 - "$CERT_SHA256" <<'PY'
          import json
          import sys
          from pathlib import Path

          fingerprint = sys.argv[1]
          data = [
              {
                  "relation": [
                      "delegate_permission/common.handle_all_urls",
                      "delegate_permission/common.get_login_creds"
                  ],
                  "target": {
                      "namespace": "android_app",
                      "package_name": "online.kingshall.foundation",
                      "sha256_cert_fingerprints": [fingerprint]
                  }
              },
              {
                  "relation": ["delegate_permission/common.get_login_creds"],
                  "target": {
                      "namespace": "web",
                      "site": "https://kingshall.online"
                  }
              }
          ]
          Path("public/.well-known/assetlinks.json").write_text(
              json.dumps(data, indent=2) + "\n", encoding="utf-8"
          )
          PY

          echo "KingsHall Android origin: android:apk-key-hash:$ANDROID_KEY_HASH"
          CERT_SHA256="$CERT_SHA256" ANDROID_KEY_HASH="$ANDROID_KEY_HASH" python3 - <<'PY'
          import os
          from pathlib import Path

          android_origin = "android:apk-key-hash:" + os.environ["ANDROID_KEY_HASH"]
          fingerprint = os.environ["CERT_SHA256"]
          summary = (
              "### KingsHall WebAuthn configuration\n\n"
              "- Set `WEBAUTHN_ANDROID_ORIGIN` on the ApiKingsHall Render service to:\n\n"
              f"  `{android_origin}`\n\n"
              f"- Signing certificate SHA-256: `{fingerprint}`\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write(summary)
          PY

          # Publish the association file with the web app source so hosting deploys it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m "Configure KingsHall Android WebAuthn domain association"
            git push origin HEAD:main
          else
            echo "KingsHall assetlinks.json is already current."
          fi

      - name: Build signed production APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kingshall-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace --console=plain assembleRelease

      - name: Verify and prepare signed KingsHall APK
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" KingsHall.apk
          test -s KingsHall.apk
          sha256sum KingsHall.apk > KingsHall.apk.sha256
          echo "Prepared signed KingsHall.apk for version ${APP_VERSION}"
          ls -lh KingsHall.apk KingsHall.apk.sha256

      - name: Upload signed production APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kingshall-v${{ steps.version.outputs.app_version }}-release-apk
          path: |
            KingsHall.apk
            KingsHall.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Verify release notification credentials
        env:
          RELEASE_SECRET: ${{ secrets.KINGSHALL_RELEASE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SECRET:-}" ]; then
            echo "::error::Set KINGSHALL_RELEASE_WEBHOOK_SECRET in GitHub Actions secrets and ApiKingsHall Render environment variables before publishing a release."
            exit 1
          fi
          echo "KingsHall release notification credentials are configured."

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Choose a new app_version so each APK has a unique release tag."
            exit 1
          fi

          gh release create "$tag" KingsHall.apk KingsHall.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "KingsHall $APP_VERSION" \
            --notes "KingsHall Android release $APP_VERSION.

          Download KingsHall.apk and install it on Android. Android may ask you to confirm installation.

          Android version code: ${{ github.run_number }}"

      - name: Notify KingsHall users about this release
        env:
          API_URL: ${{ vars.KINGSHALL_API_URL || 'https://api.kingshall.online' }}
          RELEASE_SECRET: ${{ secrets.KINGSHALL_RELEASE_WEBHOOK_SECRET }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SECRET:-}" ]; then
            echo "::error::Set KINGSHALL_RELEASE_WEBHOOK_SECRET in GitHub Actions secrets and ApiKingsHall Render environment variables."
            exit 1
          fi
          payload="$(jq -n --arg tag "v$APP_VERSION" '{tag: $tag}')"
          for attempt in 1 2 3 4 5; do
            if curl --fail-with-body --silent --show-error \
              --request POST "$API_URL/api/notifications/release-published" \
              --header "Content-Type: application/json" \
              --header "X-KingsHall-Release-Secret: $RELEASE_SECRET" \
              --data "$payload"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          echo "::error::Release was published, but notifying KingsHall users failed after 5 attempts."
          exit 1
